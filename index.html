<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InvestSolo — Gestão de Sondagens</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%230A3D91%22/><text x=%2250%22 y=%2265%22 font-size=%2255%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22Arial%22>IS</text></svg>">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- ===== LOGIN ===== -->
<div id="login-screen" class="login-screen">
  <div class="login-card">
    <div class="login-logo">
      <div class="logo-mark">IS</div>
      <h1>InvestSolo</h1>
      <p>Gestão de obras de sondagem de solo</p>
    </div>
    <form id="login-form">
      <label>Usuário
        <select id="login-user" required></select>
      </label>
      <label>Senha
        <input type="password" id="login-senha" placeholder="1234" required>
      </label>
      <button type="submit" class="btn btn-primary btn-block">Entrar</button>
      <p class="login-hint">Ambiente de demonstração — senha padrão: <strong>1234</strong></p>
    </form>
  </div>
</div>

<!-- ===== APP SHELL ===== -->
<div id="app-shell" class="app-shell hidden">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="logo-mark">IS</div>
      <span>InvestSolo</span>
    </div>
    <nav class="sidebar-nav" id="sidebar-nav">
      <button class="nav-item active" data-view="dashboard"><svg viewBox="0 0 24 24"><path d="M4 4h7v7H4zM13 4h7v4h-7zM13 10h7v10h-7zM4 13h7v7H4z"/></svg><span>Dashboard</span></button>
      <button class="nav-item" data-view="agenda"><svg viewBox="0 0 24 24"><path d="M4 6h16v14H4zM4 10h16M8 3v4M16 3v4"/></svg><span>Agenda</span></button>
      <button class="nav-item" data-view="clientes"><svg viewBox="0 0 24 24"><path d="M12 12a4 4 0 100-8 4 4 0 000 8zM4 21a8 8 0 0116 0"/></svg><span>Clientes</span></button>
      <button class="nav-item" data-view="obras"><svg viewBox="0 0 24 24"><path d="M3 21h18M5 21V9l7-5 7 5v12M9 21v-6h6v6"/></svg><span>Obras</span></button>
      <button class="nav-item" data-view="relatorios"><svg viewBox="0 0 24 24"><path d="M6 2h9l5 5v15H6zM14 2v6h6M9 13h6M9 17h6M9 9h2"/></svg><span>Relatórios</span></button>
      <button class="nav-item" data-view="contas-pagar"><svg viewBox="0 0 24 24"><path d="M6 2h12v20l-3-2-3 2-3-2-3 2V2z"/><path d="M9 8h6M9 12h6M9 16h3"/></svg><span>Contas a Pagar</span></button>
      <button class="nav-item" data-view="ia"><svg viewBox="0 0 24 24"><path d="M12 2a2 2 0 012 2v1h1a4 4 0 014 4v1a2 2 0 010 4v3a4 4 0 01-4 4H9a4 4 0 01-4-4v-3a2 2 0 010-4V9a4 4 0 014-4h1V4a2 2 0 012-2zM8 13v1M16 13v1M8.5 18h7"/></svg><span>Assistente IA</span></button>
      <button class="nav-item" data-view="usuarios"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H7a4 4 0 00-4 4v2M10 11a4 4 0 100-8 4 4 0 000 8zM23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg><span>Usuários</span></button>
    </nav>
    <div class="sidebar-footer">
      <button id="theme-toggle" class="nav-item" type="button"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 109 9c0-.46-.04-.92-.1-1.36A5.4 5.4 0 0112 3z"/></svg><span>Modo escuro</span></button>
    </div>
  </aside>

  <div class="main-col">
    <header class="topbar">
      <button id="hamburger" class="icon-btn only-mobile" type="button" aria-label="Menu">
        <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <div class="topbar-search">
        <svg viewBox="0 0 24 24"><path d="M21 21l-4.3-4.3M19 11a8 8 0 11-16 0 8 8 0 0116 0z"/></svg>
        <input type="text" id="global-search" placeholder="Buscar por cliente, cidade, obra, responsável...">
      </div>
      <div class="topbar-actions">
        <div class="notif-wrap">
          <button id="notif-btn" class="icon-btn" type="button" aria-label="Notificações">
            <svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 1112 0c0 7 3 9 3 9H3s3-2 3-9z"/><path d="M10 21a2 2 0 004 0"/></svg>
            <span id="notif-count" class="notif-count hidden">0</span>
          </button>
          <div id="notif-panel" class="notif-panel hidden"></div>
        </div>
        <div class="user-chip" id="user-chip">
          <div class="avatar" id="user-avatar">?</div>
          <div class="user-meta">
            <strong id="user-nome">—</strong>
            <span id="user-perfil">—</span>
          </div>
          <button id="logout-btn" class="icon-btn" type="button" title="Sair">
            <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>
          </button>
        </div>
      </div>
    </header>

    <main class="content">
      <section id="view-dashboard" class="view"></section>
      <section id="view-agenda" class="view hidden"></section>
      <section id="view-clientes" class="view hidden"></section>
      <section id="view-obras" class="view hidden"></section>
      <section id="view-relatorios" class="view hidden"></section>
      <section id="view-contas-pagar" class="view hidden"></section>
      <section id="view-ia" class="view hidden"></section>
      <section id="view-usuarios" class="view hidden"></section>
    </main>
  </div>
</div>

<div id="modal-root"></div>
<div id="toast-wrap" class="toast-wrap"></div>

<!-- CDN libs -->
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/locales/pt-br.global.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="js/vendor/pdf.min.js"></script>

<!-- App -->
<script src="js/data.js"></script>
<script src="js/utils.js"></script>
<script src="js/auth.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/kanban.js"></script>
<script src="js/agenda.js"></script>
<script src="js/clientes.js"></script>
<script src="js/obras.js"></script>
<script src="js/orcamento-pdf.js"></script>
<script src="js/relatorios.js"></script>
<script src="js/contas-pagar.js"></script>
<script src="js/assistente-ia.js"></script>
<script src="js/usuarios.js"></script>
<script src="js/app.js"></script>
</body>
</html>
